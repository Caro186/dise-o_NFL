<div class="container mt-5">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <span class="navbar-brand me-auto">My Teams</span>
            <div class="btn-group" role="group" aria-label="Botones de acciones">
                <button type="button" class="btn btn-dark">Mostrar equipos</button>
                <button type="button" class="btn btn-dark">Ordenar por nombre</button>
            </div>
        </div>
    </nav>
  
    <div class="row mt-4">
        <!-- Carta de equipo iterando con *ngFor -->
        <div class="col-md-4 mb-4" *ngFor="let equipo of equipos">
            <div class="card bg-light h-100">
                <div class="row no-gutters h-100">
                    <div class="col-5 d-flex align-items-center justify-content-center p-2">
                        <img [src]="equipo.imagenURL" alt="{{equipo.nombre}}" style="max-height: 120px; object-fit: contain;" class="card-img">
                    </div>
                <div class="col-7">
                    <div class="card-body d-flex flex-column justify-content-between h-100">
                        <p class="card-title font-weight-bold mb-1">{{ equipo.nombre }}</p>
                        <h6 class="card-text mb-1">Manager: {{ equipo.manager }}</h6>
                        <h6 class="card-text mb-1">Estado: {{ equipo.estado }}</h6>
                        <h6 class="card-text">Liga: {{ equipo.liga }}</h6>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
