<div class="wrapper">
  <aside id="sidebar">
    <div class="d-flex">
      <button class="toggle-btn" type="button" (click)="toggleSidebar()">
        <i class="bi bi-list"></i>
      </button>
      <div class="sidebar-logo">
        <a href="#">NFL Fantasy</a>
      </div>
    </div>

    <!-- Información del usuario -->
    <div class="sidebar-user">
      <div class="user-avatar">
        {{ getUserInitials() }}
      </div>
      <div class="user-info">
        <span class="user-name">{{ currentUser?.nombreCompleto }}</span>
        <span class="user-email">{{ currentUser?.email }}</span>
      </div>
    </div>

    <ul class="sidebar-nav">
      <li class="sidebar-item">
        <a routerLink="teams" routerLinkActive="active" class="sidebar-link">
          <i class="bi bi-people-fill"></i>
          <span>Mis Equipos</span>
        </a>
      </li>
      <li class="sidebar-item">
        <a routerLink="/form" routerLinkActive="active" class="sidebar-link">
          <i class="bi bi-plus-circle-fill"></i>
          <span>Crear Equipo</span>
        </a>
      </li>
      <li class="sidebar-item">
        <a routerLink="salones" class="sidebar-link">
          <i class="bi bi-h-square"></i>
          <span>Comisionado</span>
        </a>
      </li>
      <li class="sidebar-item">
        <a routerLink="camas" class="sidebar-link">
          <i class="bi bi-clipboard-heart-fill"></i>
          <span>Gestión de camas</span>
        </a>
      </li>
      <li class="sidebar-item">
        <a routerLink="procedimientos" class="sidebar-link">
          <i class="bi bi-heart-pulse"></i>
          <span>Gestión de procedimientos</span>
        </a>
      </li>
      <li class="sidebar-item">
        <a routerLink="personal" class="sidebar-link">
          <i class="bi bi-people-fill"></i>
          <span>Gestión de personal</span>
        </a>
      </li>
      <li class="sidebar-item">
        <a routerLink="reportes" class="sidebar-link">
          <i class="bi bi-star-fill"></i>
          <span>Reportes de áreas de mejora</span>
        </a>
      </li>
      <li class="sidebar-item">
        <a routerLink="carga" class="sidebar-link">
          <i class="bi bi-person"></i>
          <span>Perfil</span>
        </a>
      </li>
    </ul>

    <div class="sidebar-footer">
      <a href="#" class="sidebar-link" (click)="logout(); $event.preventDefault()">
        <i class="bi bi-box-arrow-left"></i>
        <span>Salir</span>
      </a>
    </div>
  </aside>

  <div class="main p-3">
    <router-outlet></router-outlet>
  </div>
</div>
